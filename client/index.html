<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="苍穹矩阵（Matrix-Scholar）：面向学术文献的 RAG 平台，检索论文、多篇对比，引用可溯源到章节与页码" />
    <meta name="theme-color" content="#0b0e12" />
    <!-- iOS 添加到主屏后隐藏 Safari 的地址栏，按 App 形态启动 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="苍穹矩阵" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>苍穹矩阵 · Matrix-Scholar</title>
    <style>
      /* 首屏防白闪：默认深灰底（主题切换后由 JS 接管） */
      html,
      body {
        margin: 0;
        background-color: #0b0e12;
      }
      html:not(.dark) body {
        background-color: #f4f5f6;
      }
    </style>
    <script>
      // 在样式生效前尽早套用用户上次选择的主题，避免深/浅色闪一下
      try {
        var saved = localStorage.getItem('rag.theme')
        if (saved === 'light') document.documentElement.classList.remove('dark')
        else document.documentElement.classList.add('dark')
      } catch (e) {
        /* ignore */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

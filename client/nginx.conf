# ============================================================================
# Nginx 站点配置：托管前端静态文件 + 反向代理 /api 到后端
#
# 上游服务名 `backend` 必须与 docker-compose.yml 里的服务名一致。
# ============================================================================

upstream rag_backend {
    # backend 是 compose 里的服务名，Docker 内部 DNS 会解析到它的容器 IP
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # 上传大小限制
    # 后端 MAX_UPLOAD_SIZE_MB 默认 50，这里留余量。
    # Nginx 默认只有 1MB，不改的话稍大的文档上传会直接返回 413。
    # ------------------------------------------------------------------
    client_max_body_size 64m;

    # 基础安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 压缩（SSE 响应不要压缩，见下方 /api 段）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # ------------------------------------------------------------------
    # API 反向代理
    #
    # 【重要】proxy_pass 末尾**不能**带斜杠。
    #   正确：proxy_pass http://rag_backend;        → /api/auth/login 原样转发
    #   错误：proxy_pass http://rag_backend/;       → 会去掉 /api，变成 /auth/login
    # 本后端的路由都挂在 /api 前缀下（见 server/app/main.py 的 API_PREFIX），
    # 带斜杠会导致所有接口 404。
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://rag_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 复用后端连接（配合 upstream 的 keepalive）
        proxy_set_header Connection        "";

        # ---------- SSE 流式输出关键配置 ----------
        # 1) 关闭缓冲：否则 Nginx 会攒够 buffer 才下发，
        #    前端的「打字机效果」会变成「转圈很久 → 整段一次性出现」
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # 2) 关闭 gzip：压缩会引入额外缓冲，破坏流式
        gzip off;
        # 3) 延长超时：大模型生成一整段回答可能持续几分钟
        proxy_connect_timeout 15s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ------------------------------------------------------------------
    # 静态资源：打包文件名带内容哈希，可长期缓存
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # SPA 路由回退
    # 前端用 History 模式（/app/chat 等），直接访问或刷新子路径时
    # 服务器上并不存在这个文件，必须回退到 index.html 交给 Vue Router。
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后用户拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

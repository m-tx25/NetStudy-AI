name: CI

# 触发条件：向主分支/开发分支推送，以及所有面向 main 的 PR
on:
  push:
    branches: [main, dec/test-upload]
  pull_request:
    branches: [main]

# 同一分支连续推送时，取消上一次未跑完的任务，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 编译 / 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # 只用于测试的固定值，不是任何真实环境的密钥
      SECRET_KEY: ci-only-test-secret-key-0123456789abcdef
      DEBUG: 'true'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 语法编译检查
        # 抓语法错误与低级缩进问题，比等运行时崩更快
        run: python -m compileall -q app tests

      - name: 单元测试
        # 纯函数层：错误分类器 / 密钥加解密与掩码 / id / 配置校验
        run: python -m pytest tests/test_units.py -q

      - name: 装配冒烟
        # 确认 FastAPI 应用能完整导入（依赖没缺、循环导入没踩）
        run: python -c "import app.main; print('app imported ok')"

  frontend:
    name: 前端 · 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 生产构建
        # 构建失败通常意味着组件语法/引用出错，是最便宜的一道闸
        run: npm run build
